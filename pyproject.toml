[project]
name = "teclado-noil"
version = "0.1.0"
description = "Aplicacion de escritorio para que un nino de 3 anos aprenda las letras tecleando"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "edge-tts>=7.0",
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teclado_noil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
